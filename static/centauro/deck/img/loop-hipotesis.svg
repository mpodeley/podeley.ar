<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- A history match as a loop with four stops: propose (spark), run (prompt),
       compare (history dots against a simulated line), decide (keep or drop).
       A sibling of loop-agente.svg; the grid in the middle is the reservoir model. -->
  <defs>
    <radialGradient id="glow" cx="66%" cy="45%" r="46%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <style>
      .orbit { animation: turn 8s linear infinite; transform-origin: 840px 320px; }
      @keyframes turn { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <circle cx="840" cy="320" r="200" fill="none" stroke="#2a303b" stroke-width="8"/>
  <g fill="none" stroke="#4b5360" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(981 179) rotate(45)"><polyline points="-9,-12 8,0 -9,12"/></g>
    <g transform="translate(981 461) rotate(135)"><polyline points="-9,-12 8,0 -9,12"/></g>
    <g transform="translate(699 461) rotate(225)"><polyline points="-9,-12 8,0 -9,12"/></g>
    <g transform="translate(699 179) rotate(315)"><polyline points="-9,-12 8,0 -9,12"/></g>
  </g>

  <g class="orbit">
    <circle cx="840" cy="120" r="26" fill="#f4f4f2" opacity=".12"/>
    <circle cx="840" cy="120" r="13" fill="#f4f4f2"/>
  </g>

  <!-- the reservoir model -->
    <rect x="786" y="266" width="33" height="33" rx="8" fill="#333842"/>
    <rect x="823" y="266" width="33" height="33" rx="8" fill="#3d4350"/>
    <rect x="860" y="266" width="33" height="33" rx="8" fill="#333842"/>
    <rect x="786" y="303" width="33" height="33" rx="8" fill="#3d4350"/>
    <rect x="823" y="303" width="33" height="33" rx="8" fill="#333842"/>
    <rect x="860" y="303" width="33" height="33" rx="8" fill="#3d4350"/>
    <rect x="786" y="340" width="33" height="33" rx="8" fill="#2f7fb5"/>
    <rect x="823" y="340" width="33" height="33" rx="8" fill="#2f7fb5"/>
    <rect x="860" y="340" width="33" height="33" rx="8" fill="#2f7fb5"/>

  <!-- propose -->
  <g transform="translate(840 120)">
    <circle r="54" fill="#15181e" stroke="#F2C14E" stroke-width="6"/>
    <circle cy="4" r="12" fill="#F2C14E"/>
    <g stroke="#F2C14E" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="-29"/>
      <line x1="21" y1="-8" x2="28" y2="-13"/>
      <line x1="-21" y1="-8" x2="-28" y2="-13"/>
    </g>
  </g>

  <!-- run -->
  <g transform="translate(1040 320)">
    <circle r="54" fill="#15181e" stroke="#43C59E" stroke-width="6"/>
    <g fill="none" stroke="#43C59E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-22,-16 -2,0 -22,16"/>
      <line x1="6" y1="17" x2="26" y2="17"/>
    </g>
  </g>

  <!-- compare -->
  <g transform="translate(840 520)">
    <circle r="54" fill="#15181e" stroke="#4EA8DE" stroke-width="6"/>
    <path d="M -30 16 C -12 14 -2 -4 30 -20" fill="none" stroke="#4EA8DE" stroke-width="6" stroke-linecap="round"/>
    <g fill="#f4f4f2">
      <circle cx="-26" cy="20" r="5"/>
      <circle cx="-8" cy="16" r="5"/>
      <circle cx="10" cy="6" r="5"/>
      <circle cx="27" cy="-6" r="5"/>
    </g>
  </g>

  <!-- decide -->
  <g transform="translate(640 320)">
    <circle r="54" fill="#15181e" stroke="#FF7B54" stroke-width="6"/>
    <g fill="none" stroke="#FF7B54" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-30,-2 -20,9 -4,-12"/>
      <line x1="10" y1="-10" x2="28" y2="8"/>
      <line x1="28" y1="-10" x2="10" y2="8"/>
    </g>
  </g>
</svg>
