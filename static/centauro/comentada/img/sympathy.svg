<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Sympathy for the LLM, after Jackie Stewart's mechanical sympathy: the
       person, a hand on the model's shoulder, listening to how it works. The
       steering wheel behind is the nod to racing. -->
  <defs>
    <radialGradient id="glow" cx="66%" cy="50%" r="46%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <g id="model">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#4EA8DE"/>
      <rect x="-32" y="-180" width="64" height="58" rx="18" fill="#7cc0e8"/>
      <circle cx="-12" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="10" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
    <g id="person">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#FF7B54"/>
      <circle cx="0" cy="-150" r="31" fill="#ff9576"/>
      <circle cx="-6" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="16" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
    <style>
      .w { animation: wave 2.4s ease-in-out infinite; }
      .w.b { animation-delay: .3s; }
      .w.c { animation-delay: .6s; }
      @keyframes wave { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- a steering wheel, far back -->
  <g fill="none" stroke="#1b2029" stroke-width="18" stroke-linecap="round">
    <circle cx="860" cy="372" r="262"/>
    <path d="M 860 372 L 618 300 M 860 372 L 1102 300 M 860 372 V 630"/>
  </g>
  <circle cx="860" cy="372" r="44" fill="#1b2029"/>
  <ellipse cx="860" cy="590" rx="220" ry="16" fill="#000" opacity=".4"/>

  <use href="#person" transform="translate(770 584) scale(1.4)"/>
  <use href="#model" transform="translate(956 584) scale(1.4)"/>

  <!-- a hand on its shoulder -->
  <polyline points="806,442 862,470 912,446" fill="none" stroke="#ff9576" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- listening -->
  <g fill="none" stroke="#F2C14E" stroke-width="6" stroke-linecap="round">
    <path class="w" d="M 892 356 a 16 16 0 0 0 0 30"/>
    <path class="w b" d="M 874 344 a 30 30 0 0 0 0 54"/>
    <path class="w c" d="M 856 332 a 44 44 0 0 0 0 78"/>
  </g>
</svg>
