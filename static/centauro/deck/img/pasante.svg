<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- The rotating intern: identical interns walk in knowing nothing, pick
       things up at the desk, and leave. Only the folder stays. The row is
       spaced 320 px and steps 320 px per cycle, so the loop is seamless. -->
  <defs>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1012"/>
      <stop offset="1" stop-color="#0f1012" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1012" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1012"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".34"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="arriving"><rect x="0" y="0" width="520" height="720"/></clipPath>
    <clipPath id="atDesk"><rect x="560" y="0" width="160" height="720"/></clipPath>

    <g id="intern">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#4EA8DE"/>
      <path d="M -15 -114 L 0 -84 L 15 -114" fill="none" stroke="#F2C14E" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-9" y="-86" width="18" height="22" rx="3" fill="#f4f4f2"/>
      <rect x="-32" y="-180" width="64" height="58" rx="18" fill="#7cc0e8"/>
      <circle cx="-9" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="13" cy="-152" r="5.5" fill="#0f1012"/>
    </g>

    <g id="question" fill="none" stroke="#f4f4f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
      <path d="M -13 -236 a 14 14 0 1 1 20 12 q -7 5 -7 14"/>
      <circle cx="0" cy="-194" r="5" fill="#f4f4f2" stroke="none"/>
    </g>

    <g id="spark">
      <circle cx="0" cy="-222" r="12" fill="#F2C14E"/>
      <g stroke="#F2C14E" stroke-width="4.5" stroke-linecap="round">
        <line x1="0" y1="-246" x2="0" y2="-254"/>
        <line x1="21" y1="-236" x2="27" y2="-241"/>
        <line x1="-21" y1="-236" x2="-27" y2="-241"/>
      </g>
    </g>

    <g id="row">
      <use href="#intern" x="-320" y="560"/>
      <use href="#intern" x="0" y="560"/>
      <use href="#intern" x="320" y="560"/>
      <use href="#intern" x="640" y="560"/>
      <use href="#intern" x="960" y="560"/>
      <use href="#intern" x="1280" y="560"/>
    </g>
    <g id="rowQuestion">
      <use href="#question" x="-320" y="560"/>
      <use href="#question" x="0" y="560"/>
      <use href="#question" x="320" y="560"/>
      <use href="#question" x="640" y="560"/>
    </g>
    <g id="rowSpark">
      <use href="#spark" x="320" y="560"/>
      <use href="#spark" x="640" y="560"/>
      <use href="#spark" x="960" y="560"/>
    </g>

    <style>
      .walk { animation: step 4.6s cubic-bezier(.6, 0, .3, 1) infinite; }
      @keyframes step {
        0%, 52% { transform: translateX(0); }
        88%, 100% { transform: translateX(320px); }
      }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f1012"/>
  <rect x="0" y="560" width="1280" height="3" fill="#23272f"/>

  <!-- interns pass behind the desk -->
  <use href="#row" class="walk"/>
  <g clip-path="url(#arriving)"><use href="#rowQuestion" class="walk"/></g>
  <g clip-path="url(#atDesk)"><use href="#rowSpark" class="walk"/></g>

  <!-- the desk and the folder: the only things that do not move -->
  <circle cx="640" cy="486" r="110" fill="url(#halo)"/>
  <rect x="540" y="504" width="200" height="14" rx="7" fill="#454b57"/>
  <rect x="558" y="518" width="12" height="42" fill="#333842"/>
  <rect x="710" y="518" width="12" height="42" fill="#333842"/>
  <path d="M 596 456 h 30 l 8 10 h 44 a 6 6 0 0 1 6 6 v 32 h -88 z" fill="#c99a2c"/>
  <rect x="596" y="470" width="88" height="34" rx="5" fill="#F2C14E"/>

  <rect x="0" y="200" width="300" height="420" fill="url(#fadeL)"/>
  <rect x="980" y="200" width="300" height="420" fill="url(#fadeR)"/>
</svg>
