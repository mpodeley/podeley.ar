<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- The agent loop: think, act, look, again. The model sits in the middle
       and a token runs the circuit. Icons only; the words are spoken. -->
  <defs>
    <radialGradient id="glow" cx="66%" cy="47%" r="46%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <style>
      .orbit { animation: turn 6s linear infinite; transform-origin: 840px 340px; }
      .blink { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- track -->
  <circle cx="840" cy="340" r="210" fill="none" stroke="#2a303b" stroke-width="8"/>

  <!-- runner -->
  <g class="orbit">
    <circle cx="840" cy="130" r="26" fill="#f4f4f2" opacity=".12"/>
    <circle cx="840" cy="130" r="13" fill="#f4f4f2"/>
  </g>

  <!-- the model -->
  <rect x="770" y="270" width="140" height="128" rx="38" fill="#4EA8DE"/>
  <g class="blink" fill="#0f1012">
    <circle cx="814" cy="330" r="10"/>
    <circle cx="866" cy="330" r="10"/>
  </g>
  <rect x="806" y="398" width="68" height="16" rx="8" fill="#2f7fb5"/>

  <!-- think: top -->
  <g transform="translate(840 130)">
    <circle r="54" fill="#15181e" stroke="#FF7B54" stroke-width="6"/>
    <g fill="#FF7B54">
      <circle cx="-20" cy="0" r="7"/>
      <circle cx="0" cy="0" r="7"/>
      <circle cx="20" cy="0" r="7"/>
    </g>
  </g>

  <!-- act: lower right -->
  <g transform="translate(1022 445)">
    <circle r="54" fill="#15181e" stroke="#43C59E" stroke-width="6"/>
    <g fill="none" stroke="#43C59E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-22,-16 -2,0 -22,16"/>
      <line x1="6" y1="17" x2="26" y2="17"/>
    </g>
  </g>

  <!-- look: lower left -->
  <g transform="translate(658 445)">
    <circle r="54" fill="#15181e" stroke="#F2C14E" stroke-width="6"/>
    <path d="M -30 0 Q 0 -26 30 0 Q 0 26 -30 0 Z" fill="none" stroke="#F2C14E" stroke-width="6.5" stroke-linejoin="round"/>
    <circle r="8.5" fill="#F2C14E"/>
  </g>

  <!-- direction of travel -->
  <g fill="none" stroke="#4b5360" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1017,228 1030,246 1010,252" />
    <polyline points="852,538 832,550 852,562" />
    <polyline points="650,252 648,231 668,236" />
  </g>
</svg>
