<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- What stays is the folder: the instructions (a sheet), the data (a stack)
       and the history of what was done (a line of commits). -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .float { animation: float 5s ease-in-out infinite; }
      .float.b { animation-delay: -1.7s; }
      .float.c { animation-delay: -3.3s; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f1012"/>
  <circle cx="880" cy="430" r="330" fill="url(#halo)"/>

  <!-- back of the folder -->
  <path d="M 700 420 a 14 14 0 0 1 14 -14 h 96 l 26 30 h 210 a 14 14 0 0 1 14 14 v 150 h -360 z" fill="#c99a2c"/>

  <!-- instructions -->
  <g class="float"><g transform="rotate(-7 760 330)">
    <rect x="700" y="240" width="120" height="170" rx="10" fill="#f4f4f2"/>
    <g fill="#a3a9b3">
      <rect x="718" y="264" width="62" height="10" rx="5"/>
      <rect x="718" y="290" width="84" height="8" rx="4"/>
      <rect x="718" y="310" width="84" height="8" rx="4"/>
      <rect x="718" y="330" width="56" height="8" rx="4"/>
    </g>
  </g></g>

  <!-- data -->
  <g class="float b">
    <path d="M 834 250 v 110 a 50 18 0 0 0 100 0 v -110 z" fill="#2f7fb5"/>
    <ellipse cx="884" cy="324" rx="50" ry="18" fill="#4EA8DE"/>
    <path d="M 834 250 v 36 a 50 18 0 0 0 100 0 v -36 z" fill="#2f7fb5"/>
    <ellipse cx="884" cy="287" rx="50" ry="18" fill="#4EA8DE"/>
    <ellipse cx="884" cy="250" rx="50" ry="18" fill="#7cc0e8"/>
  </g>

  <!-- history: a line of commits -->
  <g class="float c">
    <path d="M 988 400 V 250 M 988 330 C 988 300 1030 300 1030 270 V 250" fill="none" stroke="#43C59E" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0f1012" stroke="#43C59E" stroke-width="6">
      <circle cx="988" cy="250" r="12"/>
      <circle cx="988" cy="300" r="12"/>
      <circle cx="988" cy="352" r="12"/>
      <circle cx="1030" cy="250" r="12"/>
    </g>
  </g>

  <!-- front of the folder -->
  <path d="M 676 470 a 14 14 0 0 1 14 -14 h 380 a 14 14 0 0 1 13.6 17 l -28 132 a 14 14 0 0 1 -13.6 11 h -324 a 14 14 0 0 1 -13.6 -11 z" fill="#F2C14E"/>
</svg>
