<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- A language model continues text: the sentence so far (slide label, ends
       at x=590), the model, and three candidate next words with their odds.
       Words are slide labels at x=840; the bars sit under them. -->
  <defs>
    <radialGradient id="glow" cx="54%" cy="48%" r="50%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <style>
      .cursor { animation: breathe 1.8s ease-in-out infinite; }
      .pick { animation: glow 3.6s ease-in-out infinite; }
      .blink { animation: blink 5.2s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
      @keyframes glow { 0%, 100% { opacity: .0; } 50% { opacity: .35; } }
      @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- where the next word goes -->
  <rect class="cursor" x="602" y="318" width="6" height="48" rx="3" fill="#F2C14E"/>

  <!-- the model -->
  <rect x="632" y="286" width="120" height="110" rx="33" fill="#4EA8DE"/>
  <g class="blink" fill="#0f1012">
    <circle cx="678" cy="338" r="9"/>
    <circle cx="722" cy="338" r="9"/>
  </g>
  <rect x="663" y="396" width="58" height="14" rx="7" fill="#2f7fb5"/>

  <!-- fan to the candidates -->
  <g fill="none" stroke="#2a303b" stroke-width="5" stroke-linecap="round">
    <path d="M 762 330 C 800 330 790 222 826 222"/>
    <path d="M 762 341 H 826"/>
    <path d="M 762 352 C 800 352 790 460 826 460"/>
  </g>
  <path d="M 762 330 C 800 330 790 222 826 222" fill="none" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/>

  <!-- odds: the likeliest word is the one it writes -->
  <rect class="pick" x="832" y="246" width="264" height="32" rx="16" fill="#F2C14E"/>
  <rect x="840" y="254" width="248" height="16" rx="8" fill="#F2C14E"/>
  <rect x="840" y="374" width="132" height="16" rx="8" fill="#2f7fb5"/>
  <rect x="840" y="494" width="58" height="16" rx="8" fill="#2f7fb5"/>
</svg>
