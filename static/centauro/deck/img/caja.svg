<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- The sandbox: the model works inside a box, on a copy. Whatever it throws
       bounces off the wall. The real folder sits outside, untouched. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".32"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ball { animation: throw 4.4s cubic-bezier(.3, 0, .6, 1) infinite; animation-delay: -1.5s; }
      .hit { animation: hit 4.4s linear infinite; animation-delay: -1.5s; }
      @keyframes throw {
        0% { transform: translate(0, 0); opacity: 0; }
        6% { transform: translate(10px, -6px); opacity: 1; }
        34% { transform: translate(272px, -52px); opacity: 1; }
        58% { transform: translate(196px, 78px); opacity: 1; }
        68% { transform: translate(178px, 60px); opacity: 1; }
        78% { transform: translate(166px, 78px); opacity: 1; }
        92%, 100% { transform: translate(166px, 78px); opacity: 0; }
      }
      @keyframes hit { 0%, 30% { opacity: 0; } 34%, 44% { opacity: 1; } 56%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f1012"/>
  <g transform="translate(0 -56)">
  <rect x="0" y="530" width="1280" height="3" fill="#23272f"/>

  <!-- the box -->
  <rect x="400" y="140" width="500" height="392" rx="30" fill="#14171c" stroke="#f4f4f2" stroke-width="5" opacity=".92"/>

  <!-- the copy it works on -->
  <g opacity=".42">
    <path d="M 690 458 h 30 l 8 10 h 44 a 6 6 0 0 1 6 6 v 32 h -88 z" fill="#c99a2c"/>
    <rect x="690" y="472" width="88" height="34" rx="5" fill="#F2C14E"/>
  </g>

  <!-- the model, at work -->
  <g transform="translate(540 506)">
    <rect x="-22" y="-28" width="17" height="28" rx="8" fill="#2f7fb5"/>
    <rect x="5" y="-28" width="17" height="28" rx="8" fill="#2f7fb5"/>
    <rect x="-34" y="-130" width="68" height="108" rx="30" fill="#4EA8DE"/>
    <polyline points="22,-96 54,-112 70,-134" fill="none" stroke="#7cc0e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-36" y="-202" width="72" height="66" rx="20" fill="#7cc0e8"/>
    <circle cx="-4" cy="-170" r="6" fill="#0f1012"/>
    <circle cx="20" cy="-170" r="6" fill="#0f1012"/>
  </g>

  <!-- what it throws stays inside -->
  <circle class="ball" cx="618" cy="372" r="11" fill="#f4f4f2"/>
  <g class="hit" stroke="#f4f4f2" stroke-width="5" stroke-linecap="round">
    <line x1="872" y1="296" x2="858" y2="288"/>
    <line x1="870" y1="320" x2="852" y2="320"/>
    <line x1="872" y1="344" x2="858" y2="352"/>
  </g>

  <!-- the real thing, outside -->
  <circle cx="1060" cy="470" r="130" fill="url(#halo)"/>
  <path d="M 1004 426 h 38 l 10 13 h 56 a 8 8 0 0 1 8 8 v 83 h -112 z" fill="#c99a2c"/>
  <rect x="1004" y="446" width="112" height="84" rx="7" fill="#F2C14E"/>
  </g>
</svg>
