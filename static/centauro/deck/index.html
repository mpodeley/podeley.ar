pOwo8L3NjcmlwdD4KPC9ib2R5Pgo8L2h0bWw+Cg==</script><script>
(() => {
  const NAV = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 };
  const text = (id) => new TextDecoder().decode(Uint8Array.from(atob(document.getElementById(id).textContent), (c) => c.charCodeAt(0)));
  let host = null, frame = null;
  const go = (d) => { location.hash = '#' + Math.max(1, parseInt(location.hash.slice(1) || '1', 10) + d); };
  function sync() {
    const active = document.querySelector('svg.bespoke-marp-active');
    const next = active ? active.querySelector('.pieza[data-pieza]') : null;
    if (next === host) return;
    if (host) { host.replaceChildren(); host = frame = null; window.focus(); }
    if (!next) return;
    host = next;
    frame = document.createElement('iframe');
    frame.srcdoc = text(host.dataset.pieza);
    frame.addEventListener('load', () => {
      const w = frame.contentWindow;
      w.addEventListener('keydown', (ev) => {
        if (!(ev.key in NAV)) return;
        ev.preventDefault(); ev.stopImmediatePropagation(); go(NAV[ev.key]);
      }, true);
      let x0 = null, y0 = 0;
      w.addEventListener('touchstart', (ev) => { x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; }, { passive: true });
      w.addEventListener('touchend', (ev) => {
        if (x0 === null) return;
        const dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
      }, { passive: true });
      w.focus();
    });
    host.append(frame);
  }
  // a key pressed while the deck, and not the piece, has the focus still belongs to the piece
  window.addEventListener('keydown', (ev) => {
    if (!frame || ev.key in NAV || ev.ctrlKey || ev.metaKey || ev.altKey || !frame.contentWindow) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    frame.contentWindow.focus();
    frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: ev.key, code: ev.code, bubbles: true }));
  }, true);
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
  window.addEventListener('load', sync);
})();
</script><script>
(() => {
  if (new URLSearchParams(location.search).get('view') === 'next') return;   // the presenter's preview stays still
  const WORKING = '<i></i>Working… <span>(esc to interrupt)</span>';
  const CARET = '<span class="cc-cursor"></span>';
  const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
  let current = null, index = -1, turn = 0, undo = null;

  async function play(slide, mine) {
    const cc = slide.querySelector('.cc'), panel = slide.querySelector('.carpeta');
    const saved = [cc, panel].filter(Boolean).map((el) => [el, el.innerHTML]);
    undo = () => saved.forEach(([el, html]) => { el.innerHTML = html; });
    const live = () => mine === turn;
    const rows = [...cc.querySelectorAll('.cc-log > div')];
    const files = panel ? [...panel.querySelectorAll('[data-paso]')] : [];
    const prompt = cc.querySelector('.cc-prompt'), foot = cc.querySelector('.cc-foot span');
    const idle = foot.innerHTML;
    [...rows, ...files].forEach((el) => el.classList.add('espera'));

    const working = (on) => { foot.classList.toggle('trabaja', on); foot.innerHTML = on ? WORKING : idle; };
    const show = (row, i) => {
      row.classList.remove('espera');
      files.filter((f) => +f.dataset.paso === i).forEach((f) => f.classList.replace('espera', 'llega'));
    };
    async function type(text) {
      prompt.classList.add('escribe');
      prompt.innerHTML = CARET;
      await sleep(600);
      const pace = Math.min(34, Math.max(12, 2800 / text.length));
      for (let n = 1; n <= text.length && live(); n++) {
        prompt.textContent = text.slice(0, n);
        prompt.insertAdjacentHTML('beforeend', CARET);
        await sleep(pace * (0.5 + Math.random()));
      }
      await sleep(450);
      prompt.classList.remove('escribe');
      prompt.innerHTML = '&nbsp;';
    }

    if (!rows[0].classList.contains('u')) { working(true); await sleep(700); }
    for (const [i, row] of rows.entries()) {
      if (!live()) return;
      const kind = row.classList;
      if (kind.contains('u')) {                       // a request: typed, then sent
        working(false);
        await type(row.textContent);
        if (!live()) return;
        show(row, i);
        if (i < rows.length - 1) { working(true); await sleep(800); }
      } else if (kind.contains('t')) {                // a call: it runs for a moment
        await sleep(450);
        if (!live()) return;
        show(row, i);
        kind.add('corre');
        await sleep(row.textContent.startsWith('Read') ? 500 : 1100);
        kind.remove('corre');
      } else if (kind.contains('r')) {                // its result
        show(row, i);
        await sleep(160);
      } else {                                        // what the agent says, word by word
        const words = row.textContent.split(/(?<=\s)/);
        row.textContent = '';
        show(row, i);
        for (const word of words) {
          if (!live()) return;
          row.textContent += word;
          await sleep(28);
        }
        await sleep(120);
      }
    }
    if (live()) { working(false); undo = null; }
  }

  function sync() {
    const active = document.querySelector('svg.bespoke-marp-active');
    if (active === current) return;
    const before = index;
    current = active;
    index = active ? [...active.parentNode.children].indexOf(active) : -1;
    turn++;
    if (undo) { undo(); undo = null; }
    if (active && index > before && active.querySelector('.cc')) play(active, turn);
  }
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
  window.addEventListener('load', sync);
})();
</script></body></html>
