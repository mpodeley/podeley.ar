<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Nobody tenders a spreadsheet: the person with the problem works on it
       directly. The empty space around them is the point. -->
  <defs>
    <radialGradient id="glow" cx="66%" cy="48%" r="46%">
      <stop offset="0" stop-color="#1c2533"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <style>
      .c { animation: fill 5s ease-in-out infinite; }
      .c2 { animation-delay: .5s; } .c3 { animation-delay: 1s; }
      @keyframes fill { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>
  <ellipse cx="830" cy="566" rx="330" ry="16" fill="#000" opacity=".35"/>

  <!-- the sheet, on a screen -->
  <rect x="880" y="470" width="24" height="60" fill="#333842"/>
  <rect x="800" y="524" width="184" height="14" rx="7" fill="#454b57"/>
  <rect x="690" y="170" width="404" height="306" rx="18" fill="#15181e" stroke="#2a303b" stroke-width="4"/>
  <rect x="706" y="186" width="372" height="40" rx="8" fill="#23272f"/>
  <g stroke="#2a303b" stroke-width="2">
    <line x1="706" y1="268" x2="1078" y2="268"/>
    <line x1="706" y1="310" x2="1078" y2="310"/>
    <line x1="706" y1="352" x2="1078" y2="352"/>
    <line x1="706" y1="394" x2="1078" y2="394"/>
    <line x1="706" y1="436" x2="1078" y2="436"/>
    <line x1="780" y1="226" x2="780" y2="460"/>
    <line x1="855" y1="226" x2="855" y2="460"/>
    <line x1="930" y1="226" x2="930" y2="460"/>
    <line x1="1005" y1="226" x2="1005" y2="460"/>
  </g>
  <g fill="#333842">
    <rect x="718" y="240" width="46" height="14" rx="7"/>
    <rect x="718" y="282" width="36" height="14" rx="7"/>
    <rect x="718" y="324" width="50" height="14" rx="7"/>
    <rect x="718" y="366" width="40" height="14" rx="7"/>
    <rect x="718" y="408" width="46" height="14" rx="7"/>
    <rect x="792" y="240" width="40" height="14" rx="7"/>
    <rect x="792" y="324" width="34" height="14" rx="7"/>
    <rect x="867" y="282" width="44" height="14" rx="7"/>
    <rect x="867" y="408" width="38" height="14" rx="7"/>
    <rect x="942" y="240" width="42" height="14" rx="7"/>
    <rect x="942" y="366" width="36" height="14" rx="7"/>
    <rect x="1017" y="282" width="40" height="14" rx="7"/>
    <rect x="1017" y="324" width="46" height="14" rx="7"/>
  </g>
  <rect class="c" x="784" y="272" width="67" height="34" rx="5" fill="#F2C14E"/>
  <rect class="c c2" x="859" y="314" width="67" height="34" rx="5" fill="#F2C14E"/>
  <rect class="c c3" x="934" y="398" width="67" height="34" rx="5" fill="#F2C14E"/>

  <!-- the owner of the problem, hand on the sheet -->
  <g transform="translate(560 560)">
    <rect x="-22" y="-30" width="17" height="30" rx="8" fill="#d9603c"/>
    <rect x="5" y="-30" width="17" height="30" rx="8" fill="#d9603c"/>
    <rect x="-34" y="-134" width="68" height="110" rx="30" fill="#FF7B54"/>
    <polyline points="20,-100 76,-124 128,-150" fill="none" stroke="#ff9576" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-172" r="36" fill="#FF7B54"/>
    <circle cx="14" cy="-176" r="6" fill="#0f1012"/>
    <circle cx="16" cy="-178" r="2" fill="#f4f4f2"/>
  </g>
</svg>
