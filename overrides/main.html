{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set og_title = page.meta.title if page and page.meta and page.meta.title else config.site_name %}
  {% set og_desc = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_desc }}">
  <meta property="og:image" content="https://podeley.ar/assets/og.png">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_desc }}">
  <meta name="twitter:image" content="https://podeley.ar/assets/og.png">
{% endblock %}
