    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-15" rx="23" ry="8"/><path d="M -23 -15 V 16 a 23 8 0 0 0 46 0 V -15"/></g>
