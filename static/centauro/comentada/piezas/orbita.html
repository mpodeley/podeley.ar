  strips of ground, and a dive from orbit down to the block. Self-contained: land outline,

  ?t=<seconds> draws one deterministic frame of the orbit, ?zoom=<0..1> one of the dive;
  &sintexto=1 leaves the words out.

  (98.18 degrees) and the 14.6 orbits per turn of the Earth, which is why each pass falls

const SEA = [[34, 64, 95], [14, 24, 38]], SOIL = [[92, 86, 78], [44, 41, 37]];   // lit side, far edge

// The globe at 1 px per slide pixel, only the part of the disc that is on screen.
function drawGlobe(v) {
  const x0 = Math.max(0, Math.floor(v.cx - v.R)), x1 = Math.min(W, Math.ceil(v.cx + v.R));
  const y0 = Math.max(0, Math.floor(v.cy - v.R)), y1 = Math.min(H, Math.ceil(v.cy + v.R));
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return;
  globe.width = w; globe.height = h;
  const img = gctx.createImageData(w, h), d = img.data;
  const sp = Math.sin(v.lat0 * RAD), cp = Math.cos(v.lat0 * RAD), l0 = v.lon0 * RAD, inv = 1 / v.R;
  for (let j = 0; j < h; j++) {
    const y = -(y0 + j + .5 - v.cy) * inv;
    for (let i = 0; i < w; i++) {
      const x = (x0 + i + .5 - v.cx) * inv, rr = x * x + y * y;
      if (rr > 1) continue;
      const z = Math.sqrt(1 - rr), Y = y * cp + z * sp, Z = z * cp - y * sp;
      const lat = Math.asin(Y), lon = l0 + Math.atan2(x, Z);
      // bilinear sample of the mask
      let fx = ((lon / (2 * Math.PI) + .5) % 1 + 1) % 1 * MW - .5, fy = (.5 - lat / Math.PI) * MH - .5;
      const ix = Math.floor(fx), iy = Math.max(0, Math.min(MH - 2, Math.floor(fy)));
      fx -= ix; fy = Math.max(0, Math.min(1, fy - iy));
      const a = ((ix % MW) + MW) % MW, b = (a + 1) % MW, r0 = iy * MW, r1 = r0 + MW;
      const land = ((MASK[r0 + a] * (1 - fx) + MASK[r0 + b] * fx) * (1 - fy) + (MASK[r1 + a] * (1 - fx) + MASK[r1 + b] * fx) * fy) / 255;
      const t = land < .35 ? 0 : land > .65 ? 1 : (land - .35) / .3;
      // light from the upper left, fading towards the limb; it flattens out as we come down
      const lit = Math.max(0, Math.min(1, .62 + .5 * (-.45 * x + .5 * y) + .25 * z)) * (1 - v.flat) + .32 * v.flat;
      const edge = Math.min(1, (1 - rr) * v.R * .5);                 // soft limb
      const o = (j * w + i) * 4;
      for (let c = 0; c < 3; c++) {
        const sea = SEA[1][c] + (SEA[0][c] - SEA[1][c]) * lit, soil = SOIL[1][c] + (SOIL[0][c] - SOIL[1][c]) * lit;
        d[o + c] = sea + (soil - sea) * t;
      }
      d[o + 3] = 255 * edge;
    }
  }
  gctx.putImageData(img, 0, 0);
  ctx.drawImage(globe, x0, y0);
}

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 150 }, () => [rnd() * W, rnd() * H, rnd() * 1.1 + .3, rnd() * .5 + .15]);

const S = { time: 0, dive: -1, last: 0, track: [] };   // dive < 0: in orbit; otherwise seconds into the dive
const ease = (u) => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
const lerp = (a, b, u) => a + (b - a) * u;

function view() {
  const spin = START.lon0 - 360 * (S.time / DAY_S);
  if (S.dive < 0) return { ...START, lon0: spin, k: 0, flat: 0 };
  const k = Math.min(1, S.dive / DIVE_S), u = ease(k), turn = ease(Math.min(1, k / .55));
  let from = ((spin - END.lon0 + 540) % 360) - 180 + END.lon0;      // shortest way round
  return { lon0: lerp(from, END.lon0, turn), lat0: lerp(START.lat0, END.lat0, turn),
           R: Math.exp(lerp(Math.log(START.R), Math.log(END.R), u)), cx: lerp(START.cx, END.cx, u), cy: lerp(START.cy, END.cy, u), k, flat: smooth(.3, .6, k) };
}

// (lon, lat) in degrees on a sphere of radius r (1 = the ground) to the screen; z > 0 faces us
function project(v, lon, lat, r = 1) {
  const l = (lon - v.lon0) * RAD, p = lat * RAD, p0 = v.lat0 * RAD;
  const x = Math.cos(p) * Math.sin(l), y0 = Math.sin(p), z0 = Math.cos(p) * Math.cos(l);
  const y = y0 * Math.cos(p0) - z0 * Math.sin(p0), z = y0 * Math.sin(p0) + z0 * Math.cos(p0);
  return [v.cx + v.R * r * x, v.cy - v.R * r * y, z];
}
function ground(v, lon, lat) {               // a point of the surface; behind the limb it slides to the edge
  const [x, y, z] = project(v, lon, lat);
  if (z >= 0) return [x, y];
  const d = Math.hypot(x - v.cx, y - v.cy) || 1;
  return [v.cx + (x - v.cx) * v.R / d, v.cy + (y - v.cy) * v.R / d];
}
function satellite(u) {                      // latitude and longitude (as seen from here) at orbit angle u
  const lat = Math.asin(Math.sin(INCL) * Math.sin(u));
  const lon = NODE + Math.atan2(Math.cos(INCL) * Math.sin(u), Math.cos(u));
  return [lon / RAD, lat / RAD];
}

function draw() {
  const v = view(), k = v.k, far = 1 - smooth(.05, .4, k);         // far: how much of the orbit scene is left
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = '#0f1012'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, a] of STARS) { ctx.globalAlpha = a * far; ctx.fillStyle = '#f4f4f2'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  // atmosphere and ocean
  const glow = ctx.createRadialGradient(v.cx, v.cy, v.R * .96, v.cx, v.cy, v.R * 1.16);
  glow.addColorStop(0, 'rgba(78,168,222,.34)'); glow.addColorStop(1, 'rgba(78,168,222,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(v.cx, v.cy, v.R * 1.16, 0, 7); ctx.fill();
  drawGlobe(v);

  ctx.save(); ctx.beginPath(); ctx.arc(v.cx, v.cy, v.R, 0, 7); ctx.clip();
  // the strips the radar has painted, fixed to the ground
  ctx.lineCap = 'butt'; ctx.lineWidth = v.R * SWATH_KM / EARTH_KM;
  for (const pass of S.track) {
    const age = (S.time - pass.t0) / DAY_S;
    ctx.strokeStyle = `rgba(78,168,222,${.5 * Math.max(0, 1 - age * 1.6) * far})`;
    ctx.beginPath();
    let pen = false;
    for (const [lon, lat] of pass.pts) {
      const [x, y, z] = project(v, lon, lat);
      if (z > .02) { pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; } else pen = false;
    }
    ctx.stroke();
  }
  ctx.restore();

  // the orbit and the satellite
  if (far > 0) {
    const ro = 1 + ORBIT_KM / EARTH_KM, vi = { ...v, lon0: 0 };     // the orbit does not turn with the Earth
    for (const back of [true, false]) {
      ctx.strokeStyle = `rgba(244,244,242,${(back ? .12 : .34) * far})`; ctx.lineWidth = 1.6; ctx.setLineDash(back ? [3, 7] : []);
      ctx.beginPath();
      let pen = false;
      for (let a = 0; a <= 360; a += 2) {
        const [lon, lat] = satellite(a * RAD), [x, y, z] = project(vi, lon, lat, ro);
        const hidden = z < 0 && Math.hypot(x - v.cx, y - v.cy) < v.R;
        if ((z < 0) === back && !hidden) { pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; } else pen = false;
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    const u = 2 * Math.PI * (S.time / ORBIT_S), [slon, slat] = satellite(u), [sx, sy, sz] = project(vi, slon, slat, ro);
    const hidden = sz < 0 && Math.hypot(sx - v.cx, sy - v.cy) < v.R;
    if (!hidden) {
      const [gx, gy, gz] = project(vi, slon, slat, 1);
      ctx.globalAlpha = far * (sz < 0 ? .45 : 1);
      if (gz > 0) {                                                  // the beam, down to the strip
        const w = v.R * SWATH_KM / EARTH_KM / 2, dx = gy - sy, dy = sx - gx, n = Math.hypot(dx, dy) || 1;
        const beam = ctx.createLinearGradient(sx, sy, gx, gy);
        beam.addColorStop(0, 'rgba(124,192,232,.75)'); beam.addColorStop(1, 'rgba(124,192,232,.12)');
        ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(sx, sy);
        ctx.lineTo(gx + dx / n * w, gy + dy / n * w); ctx.lineTo(gx - dx / n * w, gy - dy / n * w); ctx.closePath(); ctx.fill();
      }
      const [nx, ny] = project(vi, ...satellite(u + .02), ro), ang = Math.atan2(ny - sy, nx - sx);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ctx.fillStyle = '#4EA8DE'; ctx.fillRect(-20, -5, 13, 10); ctx.fillRect(7, -5, 13, 10);     // solar panels
      ctx.fillStyle = '#f4f4f2'; ctx.beginPath(); ctx.roundRect(-6, -7, 12, 14, 3); ctx.fill();   // body
      ctx.restore();
      if (sz >= 0) { ctx.fillStyle = '#a3a9b3'; ctx.font = "400 15px 'IBM Plex Mono', monospace"; ctx.fillText('SENTINEL-1', sx + 26, sy - 12); }
      ctx.globalAlpha = 1;
    }
  }

  // where we are going
  const [mx, my, mz] = project(v, TARGET.lon, TARGET.lat);
  if (S.dive >= 0 && mz > 0) {
    const pulse = 1 + .35 * Math.sin(S.dive * 5), a = smooth(0, .12, k) * (1 - smooth(24, 120, W * v.R / END.R));
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(242,193,78,.25)'; ctx.beginPath(); ctx.arc(mx, my, 16 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = '#F2C14E'; ctx.beginPath(); ctx.arc(mx, my, 6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  // the picture of the block, pinned to the ground: it shows up small and grows into the frame
  const size = W * v.R / END.R;
  if (S.dive >= 0 && size > 24 && BASE.complete) {
    const bw = size, bh = size * H / W;
    ctx.globalAlpha = smooth(24, 260, size);
    ctx.drawImage(BASE, mx - bw / 2, my - bh / 2, bw, bh);
    ctx.globalAlpha = 1;
  }
  text.style.opacity = S.dive < 0 ? 1 : 0;
  place.style.opacity = k > .78 ? 1 : 0;
}

function tick(now) {
  const dt = Math.min(.1, (now - S.last) / 1000); S.last = now;
  step(dt); draw(); requestAnimationFrame(tick);
}
function step(dt) {
  if (S.dive >= 0) { S.dive += dt; S.time += dt * (1 - smooth(0, .3, S.dive / DIVE_S)); }
  else S.time += dt;
  if (S.dive >= 0 && S.dive > DIVE_S * .3) return;
  // record the ground under the satellite while it is on our side
  const u = 2 * Math.PI * (S.time / ORBIT_S), [slon, slat] = satellite(u);
  const spin = START.lon0 - 360 * (S.time / DAY_S), pass = Math.floor(S.time / ORBIT_S);
  if (!S.track.length || S.track[S.track.length - 1].n !== pass) S.track.push({ n: pass, t0: S.time, pts: [] });
  S.track[S.track.length - 1].pts.push([slon + spin, slat]);
  while (S.track.length > 11) S.track.shift();
}
function warm(seconds) { for (let t = 0; t < seconds; t += .05) step(.05); }
function start() { if (S.dive < 0) S.dive = 0; }
function reset() { S.dive = -1; }
addEventListener('keydown', (ev) => {
  if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); start(); }
  else if (ev.key === 'Home') { ev.preventDefault(); reset(); }
});
addEventListener('click', start);

if (Q.get('sintexto') === '1') for (const el of document.querySelectorAll('.label, #text, #place')) el.style.display = 'none';
document.fonts.ready.then(() => {
  warm(Q.has('t') ? parseFloat(Q.get('t')) : 22);                   // arrive with a few strips already painted
  if (Q.has('zoom')) { S.dive = parseFloat(Q.get('zoom')) * DIVE_S; draw(); return; }
  if (Q.has('t')) { draw(); return; }
  S.last = performance.now(); requestAnimationFrame(tick);
});
</script>
