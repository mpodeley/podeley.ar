      <circle cx="-10" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="12" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
    <clipPath id="upstream"><rect x="0" y="238" width="470" height="224"/></clipPath>
    <clipPath id="downstream"><rect x="790" y="332" width="490" height="36"/></clipPath>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1012"/>
      <stop offset="1" stop-color="#0f1012" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1012" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1012"/>
    </linearGradient>
    <style>
      .drift { animation: drift 4s linear infinite; }
      .trickle { animation: trickle 6s linear infinite; }
      @keyframes drift { to { transform: translateX(132px); } }
      @keyframes trickle { to { transform: translateX(170px); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f1012"/>

