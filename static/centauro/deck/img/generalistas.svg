    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="-28,2 -19,-15 -9,17 1,-23 11,19 20,-9 28,2"/></g>
  </g>
  <g transform="translate(946 528)">
    <circle r="50" fill="#15181e" stroke="#454b57" stroke-width="3"/>
    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M -18 25 L 0 -27 L 18 25 M -11 5 H 11 M -6 -10 H 6 M -26 25 H 26"/></g>
  </g>
  <g transform="translate(754 528)">
    <circle r="50" fill="#15181e" stroke="#454b57" stroke-width="3"/>
    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M 0 -27 C 14 -7 20 3 20 9 a 20 20 0 0 1 -40 0 C -20 3 -14 -7 0 -27 Z"/></g>
  </g>
