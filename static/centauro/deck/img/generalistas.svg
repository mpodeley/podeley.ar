<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- The reservoir engineer as the generalist of the upstream: in the middle,
       talking to geology, geophysics, drilling, production, facilities and
       management. The model is one more seat at that table. -->
  <defs>
    <radialGradient id="glow" cx="66%" cy="46%" r="46%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <g id="person">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#FF7B54"/>
      <circle cx="0" cy="-150" r="31" fill="#ff9576"/>
      <circle cx="-10" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="12" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <g stroke="#2a303b" stroke-width="4" stroke-linecap="round">
    <line x1="850" y1="328" x2="850" y2="106"/>
    <line x1="850" y1="328" x2="1024" y2="190" stroke="#2f7fb5"/>
    <line x1="850" y1="328" x2="1066" y2="377"/>
    <line x1="850" y1="328" x2="946" y2="528"/>
    <line x1="850" y1="328" x2="754" y2="528"/>
    <line x1="850" y1="328" x2="634" y2="377"/>
    <line x1="850" y1="328" x2="676" y2="190"/>
  </g>
  <g transform="translate(850 106)">
    <circle r="50" fill="#15181e" stroke="#454b57" stroke-width="3"/>
    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M -28 -16 q 14 -11 28 0 t 28 0 M -28 2 q 14 -11 28 0 t 28 0 M -28 20 q 14 -11 28 0 t 28 0"/></g>
  </g>
  <g transform="translate(1024 190)">
    <circle r="50" fill="#15181e" stroke="#4EA8DE" stroke-width="5"/>
    <rect x="-32" y="-30" width="64" height="58" rx="18" fill="#4EA8DE"/>
    <circle cx="-11" cy="-2" r="5.5" fill="#0f1012"/><circle cx="11" cy="-2" r="5.5" fill="#0f1012"/>
  </g>
  <g transform="translate(1066 377)">
