<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Placeholder for the terminal recording (video/terminal.mp4): a terminal
       window with the request, the agent's steps as bars, and a cursor. -->
  <defs>
    <radialGradient id="glow" cx="65%" cy="46%" r="52%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <style>
      .cursor { animation: breathe 1.6s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <rect x="470" y="96" width="738" height="468" rx="20" fill="#15181e" stroke="#2a303b" stroke-width="2"/>
  <g fill="#454b57">
    <circle cx="504" cy="128" r="7"/>
    <circle cx="530" cy="128" r="7"/>
    <circle cx="556" cy="128" r="7"/>
  </g>
  <rect x="470" y="158" width="738" height="2" fill="#2a303b"/>

  <!-- the request -->
  <g fill="none" stroke="#43C59E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="502,196 518,210 502,224"/>
  </g>
  <rect x="540" y="202" width="380" height="16" rx="8" fill="#f4f4f2"/>

  <!-- the agent reads, writes, runs -->
  <g fill="#4EA8DE">
    <rect x="500" y="258" width="16" height="16" rx="5"/>
    <rect x="500" y="298" width="16" height="16" rx="5"/>
    <rect x="500" y="464" width="16" height="16" rx="5"/>
  </g>
  <g fill="#454b57">
    <rect x="540" y="258" width="440" height="16" rx="8"/>
    <rect x="540" y="298" width="300" height="16" rx="8"/>
    <rect x="540" y="464" width="250" height="16" rx="8"/>
  </g>
  <rect x="540" y="336" width="630" height="106" rx="12" fill="#0f1012"/>
  <rect x="562" y="358" width="210" height="14" rx="7" fill="#4EA8DE"/>
  <rect x="784" y="358" width="120" height="14" rx="7" fill="#F2C14E"/>
  <rect x="586" y="384" width="330" height="14" rx="7" fill="#7cc0e8"/>
  <rect x="586" y="410" width="180" height="14" rx="7" fill="#43C59E"/>

  <!-- done, waiting -->
  <g fill="none" stroke="#43C59E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="502,510 518,524 502,538"/>
  </g>
  <rect class="cursor" x="540" y="510" width="16" height="28" rx="4" fill="#43C59E"/>
</svg>
