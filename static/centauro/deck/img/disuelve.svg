<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Software dissolves: a standard product (the window, with its rigid 3x3
       grid) comes apart, and the same tiles settle into the irregular outline
       of one specific problem, fitting it exactly. Generated by gen_disuelve.py;
       the negative delay makes the still frame show the move half done. -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="43%" r="42%">
      <stop offset="0" stop-color="#22293a"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".2"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { transform-box: fill-box; transform-origin: center; animation-duration: 10s;
           animation-timing-function: cubic-bezier(.45, 0, .3, 1); animation-iteration-count: infinite;
           animation-delay: -3.0s; }
      @keyframes t0 { 0%, 8% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 16% { transform: translate(250px, -42px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 24%, 86% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t1 { 0%, 12% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 20% { transform: translate(218px, -138px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 28%, 86% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t2 { 0%, 16% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 24% { transform: translate(218px, -138px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 32%, 86% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t3 { 0%, 20% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 28% { transform: translate(250px, -42px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 36%, 86% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t4 { 0%, 24% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 32% { transform: translate(250px, -42px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 40%, 86% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(500px, 56px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t5 { 0%, 28% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 36% { transform: translate(218px, -170px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 44%, 86% { transform: translate(436px, -200px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(436px, -200px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t6 { 0%, 32% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 40% { transform: translate(250px, -74px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 48%, 86% { transform: translate(500px, -8px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(500px, -8px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t7 { 0%, 36% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 44% { transform: translate(250px, -74px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 52%, 86% { transform: translate(500px, -8px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(500px, -8px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
      @keyframes t8 { 0%, 40% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } 48% { transform: translate(218px, -138px) rotate(50deg); fill: #6fa3c4; opacity: 1; } 56%, 86% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 1; } 90% { transform: translate(436px, -136px) rotate(90deg); fill: #4EA8DE; opacity: 0; } 91% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 0; } 100% { transform: translate(0, 0) rotate(0deg); fill: #7d838e; opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- the product: a window with fixed slots -->
  <rect x="330" y="190" width="260" height="290" rx="20" fill="#15181e" stroke="#454b57" stroke-width="5"/>
  <path d="M 330 232 V 210 a 20 20 0 0 1 20 -20 H 570 a 20 20 0 0 1 20 20 V 232 Z" fill="#2a303b"/>
  <g fill="#454b57">
    <circle cx="356" cy="212" r="7"/>
    <circle cx="378" cy="212" r="7"/>
    <circle cx="400" cy="212" r="7"/>
  </g>
  <g fill="none" stroke="#2a303b" stroke-width="3">
    <rect x="498" y="258" width="52" height="52" rx="10"/>
    <rect x="498" y="322" width="52" height="52" rx="10"/>
    <rect x="498" y="386" width="52" height="52" rx="10"/>
    <rect x="434" y="258" width="52" height="52" rx="10"/>
    <rect x="434" y="322" width="52" height="52" rx="10"/>
    <rect x="434" y="386" width="52" height="52" rx="10"/>
    <rect x="370" y="258" width="52" height="52" rx="10"/>
    <rect x="370" y="322" width="52" height="52" rx="10"/>
    <rect x="370" y="386" width="52" height="52" rx="10"/>
  </g>

  <!-- the problem: its own shape -->
  <circle cx="928" cy="308" r="250" fill="url(#halo)"/>
  <path d="M 800 244 L 864 244 L 864 180 L 992 180 L 992 308 L 1056 308 L 1056 372 L 992 372 L 992 436 L 928 436 L 928 372 L 864 372 L 864 308 L 800 308 Z" fill="#F2C14E" fill-opacity=".07" stroke="#F2C14E" stroke-width="5" stroke-linejoin="round"/>

  <!-- the tiles -->
  <rect class="t" style="animation-name: t0" x="498" y="258" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t1" x="498" y="322" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t2" x="498" y="386" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t3" x="434" y="258" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t4" x="434" y="322" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t5" x="434" y="386" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t6" x="370" y="258" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t7" x="370" y="322" width="52" height="52" rx="10" fill="#7d838e"/>
  <rect class="t" style="animation-name: t8" x="370" y="386" width="52" height="52" rx="10" fill="#7d838e"/>
</svg>
