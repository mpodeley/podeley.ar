<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- One per team. Left: the team as it is today, with the simulation
       engineer (orange) at the simulator. Right: the same team, where that
       same seat is now the centaur. -->
  <defs>
    <g id="pn">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#7d838e"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#7d838e"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#a3a9b3"/>
      <circle cx="0" cy="-150" r="31" fill="#c9ced6"/>
      <circle cx="-4" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="16" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f2a3b"/>
      <stop offset="1" stop-color="#0f1012" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bob { animation: bob 3.6s ease-in-out infinite; }
      .spark { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tail { animation: sway 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0%; }
      .cell { animation: cell 4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .8; } }
      @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
      @keyframes cell { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f1012"/>
  <circle cx="1110" cy="420" r="260" fill="url(#glow)"/>
  <rect x="0" y="560" width="1280" height="3" fill="#23272f"/>

  <!-- today -->
  <use href="#pn" x="96" y="560"/>
  <use href="#pn" x="170" y="560"/>
  <use href="#pn" x="244" y="560"/>
  <use href="#pn" x="318" y="560"/>
  <g transform="translate(406 560)">
    <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
    <rect x="5" y="-26" width="15" height="26" rx="7" fill="#d9603c"/>
    <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#FF7B54"/>
    <circle cx="0" cy="-150" r="31" fill="#FF7B54"/>
    <circle cx="-4" cy="-152" r="5.5" fill="#0f1012"/>
    <circle cx="16" cy="-152" r="5.5" fill="#0f1012"/>
  </g>

  <!-- the simulator: a gridded block on a stand -->
  <rect x="500" y="528" width="62" height="32" rx="6" fill="#333842"/>
  <g transform="translate(466 478) scale(1.3)">
    <polygon points="0,-40 50,-65 100,-40 50,-15" fill="#7cc0e8"/>
    <polygon points="0,-40 50,-15 50,45 0,20" fill="#4EA8DE"/>
    <polygon points="50,-15 100,-40 100,20 50,45" fill="#2f7fb5"/>
    <polygon class="cell" points="16.7,-11.7 33.3,-3.3 33.3,16.7 16.7,8.3" fill="#F2C14E"/>
    <g stroke="#0f1012" stroke-width="1.6" opacity=".45" fill="none">
      <line x1="16.7" y1="-31.7" x2="66.7" y2="-56.7"/>
      <line x1="33.3" y1="-23.3" x2="83.3" y2="-48.3"/>
      <line x1="16.7" y1="-48.3" x2="66.7" y2="-23.3"/>
      <line x1="33.3" y1="-56.7" x2="83.3" y2="-31.7"/>
      <line x1="16.7" y1="-31.7" x2="16.7" y2="28.3"/>
      <line x1="33.3" y1="-23.3" x2="33.3" y2="36.7"/>
      <line x1="0" y1="-20" x2="50" y2="5"/>
      <line x1="0" y1="0" x2="50" y2="25"/>
      <line x1="66.7" y1="-23.3" x2="66.7" y2="36.7"/>
      <line x1="83.3" y1="-31.7" x2="83.3" y2="28.3"/>
      <line x1="50" y1="5" x2="100" y2="-20"/>
      <line x1="50" y1="25" x2="100" y2="0"/>
    </g>
  </g>

  <!-- becomes -->
  <g fill="none" stroke="#454b57" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="622,420 644,442 622,464"/>
    <polyline points="648,420 670,442 648,464"/>
  </g>

  <!-- the same team, with a centaur in that seat -->
  <use href="#pn" x="724" y="560"/>
  <use href="#pn" x="798" y="560"/>
  <use href="#pn" x="872" y="560"/>
  <use href="#pn" x="946" y="560"/>

  <g transform="translate(1104 261) scale(.5)">
    <g fill="#2f7fb5">
      <rect x="-150" y="440" width="32" height="150" rx="16"/>
      <rect x="62" y="440" width="32" height="150" rx="16"/>
    </g>
    <g fill="#1d4f72">
      <rect x="-150" y="570" width="32" height="24" rx="8"/>
      <rect x="62" y="570" width="32" height="24" rx="8"/>
    </g>
    <g class="bob">
      <path class="tail" d="M -172 398 C -236 400 -252 466 -226 522" fill="none" stroke="#2f7fb5" stroke-width="26" stroke-linecap="round"/>
      <rect x="-180" y="350" width="330" height="122" rx="61" fill="#4EA8DE"/>
      <circle cx="118" cy="388" r="72" fill="#4EA8DE"/>
      <g fill="none" stroke="#f4f4f2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
        <polyline points="-84,388 -56,410 -84,432"/>
        <line x1="-38" y1="434" x2="6" y2="434"/>
      </g>
      <path d="M 82 356 V 264 a 44 44 0 0 1 88 0 V 356 Z" fill="#FF7B54"/>
      <rect x="78" y="350" width="96" height="16" rx="8" fill="#F2C14E"/>
      <polyline points="138,272 196,312 244,280" fill="none" stroke="#ff9576" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="spark">
        <circle cx="252" cy="268" r="18" fill="#F2C14E"/>
        <g stroke="#F2C14E" stroke-width="7" stroke-linecap="round">
          <line x1="252" y1="232" x2="252" y2="218"/>
          <line x1="282" y1="248" x2="292" y2="240"/>
          <line x1="286" y1="282" x2="298" y2="287"/>
          <line x1="224" y1="244" x2="215" y2="235"/>
        </g>
      </g>
      <circle cx="128" cy="178" r="46" fill="#FF7B54"/>
      <circle cx="148" cy="172" r="7.5" fill="#0f1012"/>
    </g>
    <g fill="#4EA8DE">
      <rect x="-122" y="440" width="34" height="156" rx="17"/>
      <rect x="100" y="440" width="34" height="156" rx="17"/>
    </g>
    <g fill="#1d4f72">
      <rect x="-122" y="574" width="34" height="24" rx="8"/>
      <rect x="100" y="574" width="34" height="24" rx="8"/>
    </g>
  </g>
</svg>
