<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- A brilliant intern on day one: sharp, well equipped, and with no context.
       Around it, faint, what it does not know yet: the field, the rules, what
       was decided last month. -->
  <defs>
    <radialGradient id="glow" cx="65%" cy="55%" r="44%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <g id="intern">
      <rect x="-20" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="5" y="-26" width="15" height="26" rx="7" fill="#2f7fb5"/>
      <rect x="-30" y="-116" width="60" height="96" rx="26" fill="#4EA8DE"/>
      <path d="M -15 -114 L 0 -84 L 15 -114" fill="none" stroke="#F2C14E" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-9" y="-86" width="18" height="22" rx="3" fill="#f4f4f2"/>
      <rect x="-32" y="-180" width="64" height="58" rx="18" fill="#7cc0e8"/>
      <circle cx="-9" cy="-152" r="5.5" fill="#0f1012"/>
      <circle cx="13" cy="-152" r="5.5" fill="#0f1012"/>
    </g>
    <g id="question" fill="none" stroke="#f4f4f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <path d="M -13 -24 a 14 14 0 1 1 20 12 q -7 5 -7 14"/>
      <circle cx="0" cy="18" r="5" fill="#f4f4f2" stroke="none"/>
    </g>
    <style>
      .float { animation: float 5s ease-in-out infinite; }
      .float.b { animation-delay: -1.6s; }
      .float.c { animation-delay: -3.1s; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle.b { animation-delay: -1.4s; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#glow)"/>
  <ellipse cx="840" cy="588" rx="150" ry="14" fill="#000" opacity=".4"/>

  <!-- what it does not know: a well, the rule book, the calendar -->
  <g fill="none" stroke="#3d4350" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g class="float">
      <path d="M 560 330 V 250 M 536 330 H 584 M 544 250 H 576 M 538 286 H 582"/>
      <circle cx="560" cy="232" r="14"/>
      <circle cx="530" cy="286" r="8"/>
      <circle cx="590" cy="286" r="8"/>
    </g>
    <g class="float b">
      <rect x="1040" y="210" width="96" height="120" rx="10"/>
      <path d="M 1062 210 V 330 M 1082 246 H 1116 M 1082 272 H 1116"/>
    </g>
    <g class="float c">
      <rect x="1060" y="440" width="110" height="96" rx="12"/>
      <path d="M 1060 470 H 1170 M 1086 428 V 452 M 1144 428 V 452"/>
      <g fill="#3d4350" stroke="none">
        <circle cx="1088" cy="494" r="5"/><circle cx="1115" cy="494" r="5"/><circle cx="1142" cy="494" r="5"/>
        <circle cx="1088" cy="516" r="5"/><circle cx="1115" cy="516" r="5"/>
      </g>
    </g>
  </g>

  <!-- the intern -->
  <use href="#intern" transform="translate(840 584) scale(1.55)"/>
  <use href="#question" transform="translate(840 250) scale(1.5)"/>

  <!-- bright -->
  <g fill="#F2C14E">
    <path class="twinkle" d="M 720 340 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 z"/>
    <path class="twinkle b" d="M 962 300 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 z"/>
  </g>
</svg>
