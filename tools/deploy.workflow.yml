# Deploy automático a podeley/podeley.github.io — INACTIVO a propósito.
#
# Vive en tools/ y no en .github/workflows/ porque el token actual de gh no
# tiene el scope `workflow` (no puede pushear archivos de workflow; mismo
# bloqueo que en simulador-mater-argentina). Para activarlo:
#
#   1. Crear un fine-grained PAT con permiso Contents:write sobre
#      podeley/podeley.github.io, y guardarlo como secret ORG_PAGES_TOKEN
#      en mpodeley/podeley.ar (Settings → Secrets → Actions).
#   2. Mover este archivo a .github/workflows/deploy.yml — por la web UI
#      (Add file) o tras `gh auth refresh -h github.com -s workflow`.
#   3. Borrar el paso predeploy del script `deploy` local si se quiere que
#      la única vía de publicación sea el push a main.

name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ORG_PAGES_TOKEN }}
          external_repository: podeley/podeley.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
