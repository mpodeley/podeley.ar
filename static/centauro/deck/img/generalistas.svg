    <g fill="none" stroke="#c9ced6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M -26 25 H 26"/><g fill="#c9ced6" stroke="none"><rect x="-22" y="6" width="11" height="15" rx="3"/><rect x="-5.5" y="-8" width="11" height="29" rx="3"/><rect x="11" y="-22" width="11" height="43" rx="3"/></g></g>
